<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Numeric Cipher Workbench</title>
<style>
:root{
  --bg:#0b0e14; --panel:#121722; --panel2:#0e1320; --line:#1f2937;
  --txt:#c9d4e3; --dim:#6b7a90; --faint:#3b4757;
  --acc:#4cc2ff; --acc2:#8b7cf6; --ok:#3ddc97; --warn:#ffb454; --bad:#ff6b6b;
  --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 system-ui,sans-serif}
header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
header h1{font:600 13px var(--mono);letter-spacing:.2em;color:var(--dim);margin:0;text-transform:uppercase}
#tabs{display:flex;flex-wrap:wrap;gap:2px;padding:8px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
#tabs button{background:none;border:none;border-bottom:2px solid transparent;color:var(--dim);font:12px var(--mono);padding:8px 10px;cursor:pointer}
#tabs button.active{color:var(--acc);border-bottom-color:var(--acc)}
main{padding:16px;max-width:1200px;margin:0 auto}
.tabpane{display:none}.tabpane.show{display:block}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:14px}
.panel h3{margin:0 0 10px;font:600 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
textarea,input[type=text],input[type=number],select{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:5px;padding:8px 10px;font:13px var(--mono);outline:none;max-width:100%}
textarea{width:100%;resize:vertical}
textarea:focus,input:focus{border-color:var(--acc)}
button.act{background:#16324a;color:var(--acc);border:1px solid #24537a;border-radius:5px;padding:7px 14px;font:12px var(--mono);cursor:pointer}
button.act:hover{background:#1b3d5c}
button.ghost{background:var(--panel2);color:var(--dim);border:1px solid var(--line);border-radius:5px;padding:7px 12px;font:12px var(--mono);cursor:pointer}
button.danger{background:#3a1420;color:var(--bad);border:1px solid #5c2233;border-radius:5px;padding:7px 12px;font:12px var(--mono);cursor:pointer}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:8px 12px;min-width:120px}
.stat .k{font:10px var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--faint)}
.stat .v{font:16px var(--mono);color:var(--txt)}
.stat.ok .v{color:var(--ok)}.stat.warn .v{color:var(--warn)}.stat.bad .v{color:var(--bad)}
table{border-collapse:collapse;font:12px var(--mono);width:100%}
th,td{border:1px solid var(--line);padding:4px 8px;text-align:left}
th{color:var(--faint);text-transform:uppercase;font-size:10px;letter-spacing:.08em;background:var(--panel2)}
.scroll{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:6px}
.mono{font-family:var(--mono)}
.tokstream{font:13px/2 var(--mono);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:10px;max-height:300px;overflow:auto;word-break:break-word}
.tok{display:inline-block;margin:1px;padding:1px 4px;border-radius:3px;background:#1a2233;color:var(--dim);cursor:pointer}
.tok.mapped{background:#123528;color:var(--ok)}
.tok.hl{outline:1px solid var(--warn)}
.badge{display:inline-block;padding:1px 8px;border-radius:10px;font:10px var(--mono);border:1px solid}
.badge.fact{color:var(--ok);border-color:var(--ok)}
.badge.assume{color:var(--warn);border-color:var(--warn)}
.badge.hypo{color:var(--acc2);border-color:var(--acc2)}
.badge.rej{color:var(--bad);border-color:var(--bad)}
.note{font-size:12px;color:var(--dim)}
.warnbox{background:#2a2010;border:1px solid #5c4a22;color:var(--warn);border-radius:6px;padding:8px 12px;font:12px var(--mono);margin:8px 0}
.okbox{background:#0f2a1e;border:1px solid #1f5c40;color:var(--ok);border-radius:6px;padding:8px 12px;font:12px var(--mono);margin:8px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:800px){.grid2{grid-template-columns:1fr}}
pre.out{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:10px;font:12px/1.7 var(--mono);white-space:pre-wrap;word-break:break-all;max-height:300px;overflow:auto}
label.inline{font:12px var(--mono);color:var(--dim);display:flex;gap:6px;align-items:center}
.small{font-size:11px;color:var(--faint)}
#testresults div{font:12px var(--mono);padding:2px 0}
.pass{color:var(--ok)}.fail{color:var(--bad)}
</style>
</head>

  removedPrefix: "", removedSuffix: "",
  offset: 0, width: 2,
  tokens: [],              // token stream (strings)
  trailing: "",            // leftover digits that don't fill a token
  map: {},                 // token -> {ch, locked}
  homophonic: false,

  log: [],

/* ============================================================
   UTILITIES
   ============================================================ */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function digitsOnly(s){ return (s||"").replace(/[^0-9]/g,""); }
function hashStr(s){ // FNV-1a 32-bit, for audit log
  let h = 0x811c9dc5;
  for(let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = (h*0x01000193)>>>0; }
  return h.toString(16).padStart(8,"0");
}
function nowISO(){ return new Date().toISOString(); }
function download(name, text, type="text/plain"){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([text],{type}));
  a.download=name; a.click(); URL.revokeObjectURL(a.href);
}
/* Seeded PRNG (mulberry32) for reproducible solver runs */
function mulberry32(seed){
  let a = seed>>>0;
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ============================================================
   TOKENIZATION  (pure, unit-tested)
   ============================================================ */
function tokenize(stream, offset, width){
  // returns {tokens, skippedPrefix, trailing}
  const skippedPrefix = stream.slice(0, offset);
  const body = stream.slice(offset);
  const tokens = [];
  let i = 0;
  for(; i + width <= body.length; i += width) tokens.push(body.slice(i, i+width));
  const trailing = body.slice(i);
  return { tokens, skippedPrefix, trailing };
}

/* ============================================================
   STATISTICS (pure)
   ============================================================ */
function freqTable(tokens){
  const f = new Map();
  tokens.forEach((t,i)=>{
    if(!f.has(t)) f.set(t,{count:0,positions:[]});
    const e=f.get(t); e.count++; e.positions.push(i);
  });
  return f;
}
function indexOfCoincidence(tokens){
  const n = tokens.length; if(n<2) return 0;
  let sum=0; for(const {count} of freqTable(tokens).values()) sum += count*(count-1);
  return sum/(n*(n-1));
}
function entropyOf(tokens){
  const n=tokens.length; if(!n) return 0;
  let H=0; for(const {count} of freqTable(tokens).values()){ const p=count/n; H-=p*Math.log2(p); }
  return H;
}
function ngrams(tokens, n){
  const m=new Map();
  for(let i=0;i+n<=tokens.length;i++){
    const g=tokens.slice(i,i+n).join(" ");
    if(!m.has(g)) m.set(g,[]);
    m.get(g).push(i);
  }
  const rep=[...m.entries()].filter(([,pos])=>pos.length>1);
  rep.sort((a,b)=>b[1].length-a[1].length);
  return rep;
}
function runs(tokens){
  const out=[];
  let i=0;
  while(i<tokens.length){
    let j=i; while(j+1<tokens.length && tokens[j+1]===tokens[i]) j++;
    if(j>i) out.push({token:tokens[i], length:j-i+1, position:i});
    i=j+1;
  }
  return out;
}
function adjacency(tokens){
  const before=new Map(), after=new Map();
  for(let i=0;i<tokens.length;i++){
    const t=tokens[i];
    if(i>0){ if(!before.has(t))before.set(t,new Map()); const m=before.get(t); m.set(tokens[i-1],(m.get(tokens[i-1])||0)+1); }
    if(i<tokens.length-1){ if(!after.has(t))after.set(t,new Map()); const m=after.get(t); m.set(tokens[i+1],(m.get(tokens[i+1])||0)+1); }
  }
  return {before,after};
}
/* abstract repetition pattern: ABCA etc. */
function abstractPattern(seq){
  const seen={}; let next=65; let out="";
  for(const s of seq){ if(!(s in seen)) seen[s]=String.fromCharCode(next++); out+=seen[s]; }
  return out;
}

<script>
"use strict";
/* ============================================================
   SCORING for solvers: letters + bigram + trigram log scores
   ============================================================ */
const logBG = {}, logTG = {}, logUF = {};
for(const k in BG) logBG[k]=Math.log10(BG[k]/100);
for(const k in TG) if(k.length===3) logTG[k]=Math.log10(TG[k]/100);
for(const k in ENG_FREQ) logUF[k]=Math.log10(ENG_FREQ[k]/100);
const FLOOR_BG=-4.5, FLOOR_TG=-5.5, FLOOR_UF=-4;

const WORD_BONUS_LIST = null; // initialized lazily below (COMMON_WORDS defined in first block)
let _wordsByLen = null;
function wordsByLen(){
  if(!_wordsByLen){
    _wordsByLen = {};
    for(const w of COMMON_WORDS){
      if(w.length<3 || w.length>9) continue;
      (_wordsByLen[w.length] = _wordsByLen[w.length] || new Set()).add(w);
    }
  }
  return _wordsByLen;
}
function scoreText(txt){
  // txt: uppercase letters + '?' placeholders. '?' contributes floor.
  let s=0;
  for(let i=0;i<txt.length;i++){
    const u=txt[i];
    s += (logUF[u] !== undefined ? logUF[u] : FLOOR_UF)*0.5;
    if(i+1<txt.length){
      const b=txt.slice(i,i+2);
      s += (logBG[b]!==undefined?logBG[b]:FLOOR_BG);
    }
    if(i+2<txt.length){
      const t=txt.slice(i,i+3);
      s += (logTG[t]!==undefined?logTG[t]:FLOOR_TG)*1.5;
    }
  }
  // common-word bonus: reward substrings that spell frequent English words.
  // NOTE: this biases the OPTIMIZER only; validation must still use shuffled
  // controls, since accidental words occur in any high-scoring assignment.
  const byLen = wordsByLen();
  let bonus=0;
  for(const lenStr in byLen){
    const L=+lenStr, set=byLen[lenStr];
    for(let i=0;i+L<=txt.length;i++){
      if(set.has(txt.substr(i,L))) bonus += L*L*0.15;
    }
  }
  return (s + bonus) / Math.max(1,txt.length); // normalized per char
}

/* ============================================================
   PREPROCESSING
   ============================================================ */
function applyPreprocess(){
  const norm = S.normalized;
  let work = norm;
  let removedP = "", removedS = "";
  const audit = [];

  const pn = parseInt($("preN").value||"0",10);
  const sn = parseInt($("sufN").value||"0",10);
  const ps = digitsOnly($("preStr").value);
  const ss = digitsOnly($("sufStr").value);

  if(ps){
    if(work.startsWith(ps)){ removedP += ps; work = work.slice(ps.length); audit.push(`removed exact prefix "${ps}" (${ps.length} digits)`); }
    else audit.push(`WARN: prefix string "${ps}" not found at start — nothing removed`);
  }
  if(pn>0){
    const cut = work.slice(0,pn); removedP += cut; work = work.slice(pn);
    audit.push(`removed first ${pn} digits: "${cut}"`);
  }
  if(ss){
    if(work.endsWith(ss)){ removedS = ss + removedS; work = work.slice(0, -ss.length); audit.push(`removed exact suffix "${ss}" (${ss.length} digits)`); }
    else audit.push(`WARN: suffix string "${ss}" not found at end — nothing removed`);
  }
  if(sn>0){
    const cut = work.slice(-sn); removedS = cut + removedS; work = work.slice(0,-sn);
    audit.push(`removed last ${sn} digits: "${cut}"`);
  }

  S.stream = work; S.removedPrefix=removedP; S.removedSuffix=removedS;
  retokenize();
  renderPreprocess(audit);
  addLog("preprocess",{prefixN:pn,suffixN:sn,prefixStr:ps,suffixStr:ss,removedPrefix:removedP,removedSuffix:removedS,remaining:work.length});
}

function retokenize(){
  const {tokens, trailing} = tokenize(S.stream, S.offset, S.width);
  S.tokens = tokens; S.trailing = trailing;
}

/* ============================================================
   LOG
   ============================================================ */
function addLog(action, params, result){
  S.log.push({
    ts: nowISO(),
    action,
    inputHash: hashStr(S.normalized),
    streamHash: hashStr(S.stream),
    offset: S.offset, width: S.width,
    mappings: JSON.parse(JSON.stringify(S.map)),
    params: params||{},
    result: result||null
  });
  renderLogCount();
}

/* ============================================================
   PARTIAL DECODE
   ============================================================ */
function partialDecode(tokens, map){
  return tokens.map(t => map[t] ? map[t].ch : "?");
}
function decodeString(tokens, map){
  return partialDecode(tokens, map).join("");
}

/* ============================================================
   CRIB ALIGNMENT (pure)
   ============================================================ */
function cribAlign(tokens, crib, homophonic){
  // crib: uppercase letters only
  const results = [];
  const L = crib.length;
  for(let pos=0; pos+L<=tokens.length; pos++){
    const t2p = {}; // token -> letter
    const p2t = {}; // letter -> token (for one-to-one check)
    let ok = true, conflicts = 0;
    for(let i=0;i<L;i++){
      const tok = tokens[pos+i], ch = crib[i];
      if(t2p[tok] !== undefined && t2p[tok] !== ch){ ok=false; break; }
      if(!homophonic && p2t[ch] !== undefined && p2t[ch] !== tok){ ok=false; break; }
      t2p[tok]=ch; p2t[ch]=tok;
    }
    if(!ok) continue;
    // also check against locked user mappings
    let clash = false;
    for(const tok in t2p){
      if(S.map[tok] && S.map[tok].locked && S.map[tok].ch !== t2p[tok]){ clash=true; break; }
    }
    if(clash) continue;
    // score: how much this alignment "reuses" repeated tokens & how well pattern fits
    const uniq = Object.keys(t2p).length;
    const reuse = L - uniq; // repeated-letter structure satisfied
    // bonus: consistency with existing (unlocked) mappings
    let agree=0;
    for(const tok in t2p) if(S.map[tok] && S.map[tok].ch===t2p[tok]) agree++;
    results.push({pos, map:t2p, reuse, agree, score: reuse*2 + agree*3});
  }
  results.sort((a,b)=>b.score-a.score || a.pos-b.pos);
  return results;
}

/* ============================================================
   PATTERN MATCHING against word list
   ============================================================ */
function wordsMatchingPattern(pat){
  return COMMON_WORDS.filter(w => w.length===pat.length && abstractPattern(w.split(""))===pat);
}

/* ============================================================
   SEGMENTATION (dynamic programming with word list)
   ============================================================ */
const WORDSET = new Set(COMMON_WORDS);
function segmentDP(txt){
  // txt uppercase, possibly with '?'; returns best segmentation or null
  const n = txt.length;
  const best = new Array(n+1).fill(null); best[0]={score:0,words:[]};
  const maxW = 14;
  for(let i=1;i<=n;i++){
    for(let j=Math.max(0,i-maxW); j<i; j++){
      if(!best[j]) continue;
      const w = txt.slice(j,i);
      if(w.includes("?")) continue;
      let sc = -Infinity;
      if(WORDSET.has(w)) sc = best[j].score + Math.log(1+w.length*w.length);
      else if(w.length===1 && (w==="A"||w==="I")) sc = best[j].score + 0.1;
      if(sc>-Infinity && (!best[i] || sc>best[i].score)){
        best[i]={score:sc, words:best[j].words.concat([w])};
      }
    }
    // fallback: allow single unknown char with penalty so DP always completes
    if(!best[i] && best[i-1]) best[i]={score:best[i-1].score-3, words:best[i-1].words.concat([txt[i-1]])};
  }
  return best[n];
}

/* ============================================================
   SOLVERS
   ============================================================ */
function buildInitialKey(tokens, rng, locked){
  // map each unique token to a letter; frequency-rank init
  const f=[...freqTable(tokens).entries()].sort((a,b)=>b[1].count-a[1].count);
  const key={};
  let ei=0;
  for(const [tok] of f){
    if(locked[tok]){ key[tok]=locked[tok]; continue; }
    key[tok]=ENG_FREQ_ORDER[ei % 26]; ei++;
  }
  return key;
}
function decodeWithKey(tokens,key){ let s=""; for(const t of tokens) s+= key[t]||"?"; return s; }

function hillClimb(tokens, opts){
  const {seed=1, iters=8000, locked={}, restarts=1, annealing=false, homophonic=false} = opts;
  const uniq=[...new Set(tokens)];
  const free = uniq.filter(t=>!locked[t]);
  let globalBest=null;
  for(let r=0;r<restarts;r++){
    const rng = mulberry32(seed + r*7919);
    let key = buildInitialKey(tokens,rng,locked);
    // random shuffle of free assignments for restarts>0
    if(r>0){
      for(let i=free.length-1;i>0;i--){
        const j=Math.floor(rng()*(i+1));
        const a=free[i],b=free[j];
        const tmp=key[a]; key[a]=key[b]; key[b]=tmp;
      }
    }
    let cur = scoreText(decodeWithKey(tokens,key));
    let T = annealing ? 1.0 : 0;
    const cool = annealing ? Math.pow(0.001/1.0, 1/iters) : 1;
    for(let it=0; it<iters; it++){
      if(free.length<2) break;
      const i=Math.floor(rng()*free.length);
      let j=Math.floor(rng()*free.length); if(j===i) j=(j+1)%free.length;
      const a=free[i], b=free[j];
      // monoalphabetic: swap-only moves preserve one-to-one structure.
      // homophonic mode adds reassign moves (many tokens → same letter allowed).
      const mode = (homophonic && rng()<0.3) ? "reassign" : "swap";
      const oldA=key[a], oldB=key[b];
      if(mode==="swap"){ key[a]=oldB; key[b]=oldA; }
      else { key[a]=ENG_FREQ_ORDER[Math.floor(rng()*26)]; }
      const ns = scoreText(decodeWithKey(tokens,key));
      const accept = ns>cur || (annealing && rng() < Math.exp((ns-cur)/Math.max(T,1e-9)));
      if(accept) cur=ns;
      else { key[a]=oldA; key[b]=oldB; }
      if(annealing) T*=cool;
    }
    const cand={score:cur, key:JSON.parse(JSON.stringify(key)), plaintext:decodeWithKey(tokens,key), seed:seed+r*7919, iters, restart:r};
    if(!globalBest || cand.score>globalBest.score) globalBest=cand;
  }
  return globalBest;
}

/* control: same solver on shuffled tokens to estimate baseline achievable score */
function shuffledControlScore(tokens, seed, iters){
  const rng=mulberry32(seed^0xBEEF);
  const shuf=[...tokens];
  for(let i=shuf.length-1;i>0;i--){ const j=Math.floor(rng()*(i+1)); [shuf[i],shuf[j]]=[shuf[j],shuf[i]]; }
  return hillClimb(shuf,{seed:seed^0xBEEF, iters, locked:{}, restarts:1}).score;
}

/* ============================================================
   TRANSPOSITIONS (pure; operate on arrays; reversible)
   ============================================================ */
const TRANS = {
  reverse: a => [...a].reverse(),
  oddEven: a => a.filter((_,i)=>i%2===0).concat(a.filter((_,i)=>i%2===1)),
  evenOdd: a => a.filter((_,i)=>i%2===1).concat(a.filter((_,i)=>i%2===0)),
  cyclicShift: (a,k) => a.slice(k%a.length).concat(a.slice(0,k%a.length)),
  railfence: (a, rails) => {
    if(rails<2) return [...a];
    const rows=Array.from({length:rails},()=>[]);
    let r=0,dir=1;
    for(const x of a){ rows[r].push(x); r+=dir; if(r===rails-1||r===0) dir*=-1; }
    return [].concat(...rows);
  },
  gridRowToCol: (a, cols) => { // write row-major, read column-major
    const rows=Math.ceil(a.length/cols); const out=[];
    for(let c=0;c<cols;c++) for(let r=0;r<rows;r++){ const i=r*cols+c; if(i<a.length) out.push(a[i]); }
    return out;
  },
  gridColToRow: (a, cols) => { // write column-major, read row-major
    const rows=Math.ceil(a.length/cols); const grid=[]; let i=0;
    for(let c=0;c<cols;c++) for(let r=0;r<rows;r++){ if(i<a.length){ grid[r*cols+c]=a[i++]; } }
    return grid.filter(x=>x!==undefined);
  },
  reversedRows: (a, cols) => {
    const out=[];
    for(let r=0;r*cols<a.length;r++){ const row=a.slice(r*cols,(r+1)*cols); out.push(...row.reverse()); }
    return out;
  },
  reversedCols: (a, cols) => {
    const rows=Math.ceil(a.length/cols); const out=new Array(a.length);
    for(let c=0;c<cols;c++){
      const col=[]; for(let r=0;r<rows;r++){const i=r*cols+c; if(i<a.length) col.push(a[i]);}
      col.reverse();
      let k=0; for(let r=0;r<rows;r++){const i=r*cols+c; if(i<a.length) out[i]=col[k++];}
    }
    return out;
  },
  boustrophedon: (a, cols) => {
    const out=[];
    for(let r=0;r*cols<a.length;r++){ let row=a.slice(r*cols,(r+1)*cols); if(r%2===1) row=row.reverse(); out.push(...row); }
    return out;
  },
  routeSpiral: (a, cols) => {
    const rows=Math.ceil(a.length/cols);
    if(rows*cols!==a.length) return null; // only exact grids
    const grid=[]; for(let r=0;r<rows;r++) grid.push(a.slice(r*cols,(r+1)*cols));
    const out=[]; let top=0,bot=rows-1,left=0,right=cols-1;
    while(top<=bot&&left<=right){
      for(let c=left;c<=right;c++) out.push(grid[top][c]); top++;
      for(let r=top;r<=bot;r++) out.push(grid[r][right]); right--;
      if(top<=bot){ for(let c=right;c>=left;c--) out.push(grid[bot][c]); bot--; }
      if(left<=right){ for(let r=bot;r>=top;r--) out.push(grid[r][left]); left++; }
    }
    return out;
  }
};
function factorizations(n){
  const f=[]; for(let c=2;c<=n/2;c++) if(n%c===0) f.push(c); return f;
}
/* permutations helper (bounded) */
function permutations(arr, limit){
  const out=[[...arr]]; 
  const c=new Array(arr.length).fill(0); const a=[...arr];
  let i=0;
  while(i<arr.length && out.length<limit){
    if(c[i]<i){
      const k = i%2===0 ? 0 : c[i];
      [a[k],a[i]]=[a[i],a[k]];
      out.push([...a]); c[i]++; i=0;
    } else { c[i]=0; i++; }
  }
  return out;
}

function renderFrequency(sort){
  const f=[...freqTable(S.tokens).entries()];
  const n=S.tokens.length||1;
  if(sort==="num") f.sort((a,b)=>a[0].localeCompare(b[0]));
  else f.sort((a,b)=>b[1].count-a[1].count);
  const byFreq=[...freqTable(S.tokens).entries()].sort((a,b)=>b[1].count-a[1].count);
  const rank={}; byFreq.forEach(([t],i)=>rank[t]=i+1);
  let h="<table><tr><th>token</th><th>count</th><th>%</th><th>rank</th><th>mapped</th><th>positions (first 12)</th></tr>";
  for(const [t,e] of f){
    h+=`<tr><td class="mono">${esc(t)}</td><td>${e.count}</td><td>${(100*e.count/n).toFixed(2)}</td><td>${rank[t]}</td><td>${S.map[t]?esc(S.map[t].ch)+(S.map[t].locked?" 🔒":""):"—"}</td><td class="small">${e.positions.slice(0,12).join(", ")}${e.positions.length>12?"…":""}</td></tr>`;
  }
  $("freqtbl").innerHTML=h+"</table>";
  // ties
  const groups={};
  byFreq.forEach(([t,e])=>{ (groups[e.count]=groups[e.count]||[]).push(t); });
  const ties=Object.entries(groups).filter(([,g])=>g.length>1);
  $("tiewarn").innerHTML = ties.length
    ? `<div class="warnbox">⚠ Frequency ties exist: ${ties.map(([c,g])=>`count ${c}: {${g.join(", ")}}`).join(" · ")}. Rank-based mapping is ambiguous within each tie group.</div>`
    : `<div class="okbox">No frequency ties among tokens.</div>`;
  // side by side
  let s="<table><tr><th>rank</th><th>cipher token</th><th>cipher %</th><th>english letter</th><th>english %</th></tr>";
  byFreq.slice(0,26).forEach(([t,e],i)=>{
    const L=ENG_FREQ_ORDER[i]||"—";
    s+=`<tr><td>${i+1}</td><td class="mono">${esc(t)}</td><td>${(100*e.count/n).toFixed(2)}</td><td>${L}</td><td>${L!=="—"?ENG_FREQ[L]:"—"}</td></tr>`;
  });
  $("sidecmp").innerHTML=s+"</table>";
}
function autoRankMap(){
  const byFreq=[...freqTable(S.tokens).entries()].sort((a,b)=>b[1].count-a[1].count);
  byFreq.slice(0,26).forEach(([t],i)=>{
    if(!(S.map[t]&&S.map[t].locked)) S.map[t]={ch:ENG_FREQ_ORDER[i],locked:false};
  });
  addLog("autoRankMap",{applied:Math.min(26,byFreq.length)});
  renderFrequency('freq'); renderSubst();
}
function tiePerms(){
  const bound=parseInt($("permBound").value,10)||24;
  const byFreq=[...freqTable(S.tokens).entries()].sort((a,b)=>b[1].count-a[1].count);
  const groups={};
  byFreq.forEach(([t,e])=>{ (groups[e.count]=groups[e.count]||[]).push(t); });
  const ties=Object.entries(groups).filter(([,g])=>g.length>1).sort((a,b)=>b[0]-a[0]);
  let out="";
  for(const [c,g] of ties){
    const perms=permutations(g,bound);
    out+=`<div class="panel"><h3>tie group (count ${c}): ${g.join(", ")} — ${perms.length} permutation(s)${perms.length>=bound?" (bounded)":""}</h3>
    <div class="small mono">${perms.slice(0,50).map(p=>p.join("·")).join("<br>")}${perms.length>50?"<br>…":""}</div></div>`;
  }
  $("permout").innerHTML = out||`<div class="okbox">No tie groups.</div>`;
  addLog("tiePermutations",{bound,groups:ties.length});
}
</script>

$("pane4").innerHTML = `

  let h="<table><tr><th>n</th><th>sequence</th><th>count</th><th>positions</th><th>pattern</th></tr>";

  const rr=runs(S.tokens);

  const lf=parseInt($("patlen")?.value||"0",10);
  let p="<table><tr><th>pattern</th><th>matching common words</th></tr>";
  for(const pat of pats){
    if(lf && pat.length!==lf) continue;

function segNow(){

function addMap(){
  const t=digitsOnly($("mtok").value), c=($("mch").value||"").toUpperCase().replace(/[^A-Z]/g,"");
  if(!t||!c) return;
  if(!S.homophonic){
    const clash=Object.entries(S.map).find(([tok,m])=>m.ch===c && tok!==t);
    if(clash && !confirm(`Letter ${c} is already assigned to token ${clash[0]}. Assign anyway (homophonic)?`)) return;
  }
  S.map[t]={ch:c,locked:$("mlock").checked};
  addLog("mapAssign",{token:t,ch:c,locked:$("mlock").checked});
  renderSubst();
}

/* ============================================================

$("pane6").innerHTML = `
<div class="panel"><h3>Crib Input</h3>
<textarea id="cribin" rows="2" placeholder="e.g. THE TREASURE IS BURIED"></textarea>
<div class="row" style="margin-top:8px">
  <label class="inline">normalize <select id="cribnorm"><option value="letters">letters only</option><option value="spaces">preserve spaces</option><option value="punct">preserve punctuation</option></select></label>
  <label class="inline"><input type="checkbox" id="cribhomo"> homophonic mode</label>
  <button class="act" onclick="runCrib()">Slide crib</button>
</div>
<div class="row">quick: ${["THE","AND","ING","THAT","PEOPLE","SHALL"].map(w=>`<button class="ghost" onclick="$('cribin').value='${w}';runCrib()">${w}</button>`).join("")}
<span class="small">(convenience buttons only — not privileged by scoring)</span></div>
<div class="note">Spaces/punctuation in a crib act as alignment gaps only when preserved — cipher tokens are matched to letters; non-letters split the crib into separately-checked segments at fixed relative offsets.</div>
</div>
<div class="panel"><h3>Alignments (consistency-checked, ranked)</h3><div class="scroll" id="cribout"></div></div>`;
function runCrib(){
  let raw=($("cribin").value||"").toUpperCase();
  const mode=$("cribnorm").value;
  const homo=$("cribhomo").checked;
  let crib;
  if(mode==="letters") crib=raw.replace(/[^A-Z]/g,"");
  else if(mode==="spaces") crib=raw.replace(/[^A-Z ]/g,"");
  else crib=raw.replace(/[^A-Z .,;:'!?-]/g,"");
  if(!crib){ $("cribout").innerHTML="<div class='note'>Empty crib.</div>"; return; }
  // for spaces/punct modes: split into letter segments with fixed offsets
  const segs=[]; let cur="",off=0,st=0;
  for(let i=0;i<crib.length;i++){
    if(/[A-Z]/.test(crib[i])){ if(!cur) st=i; cur+=crib[i]; }
    else if(cur){ segs.push({txt:cur,at:st}); cur=""; }
  }
  if(cur) segs.push({txt:cur,at:st});
  // align: token index pos corresponds to crib char index — evaluate joint consistency of all segments
  const L=crib.length;
  const results=[];
  for(let pos=0; pos+L<=S.tokens.length; pos++){
    const t2p={},p2t={}; let ok=true;
    for(const seg of segs){
      for(let i=0;i<seg.txt.length && ok;i++){
        const tok=S.tokens[pos+seg.at+i], ch=seg.txt[i];
        if(t2p[tok]!==undefined && t2p[tok]!==ch) ok=false;
        else if(!homo && p2t[ch]!==undefined && p2t[ch]!==tok) ok=false;
        else { t2p[tok]=ch; p2t[ch]=tok; }
      }
      if(!ok) break;
    }
    if(!ok) continue;
    let clash=false, agree=0;
    for(const tok in t2p){
      if(S.map[tok]&&S.map[tok].locked&&S.map[tok].ch!==t2p[tok]){clash=true;break;}
      if(S.map[tok]&&S.map[tok].ch===t2p[tok]) agree++;
    }
    if(clash) continue;
    const letters=segs.reduce((a,s)=>a+s.txt.length,0);
    const reuse=letters-Object.keys(t2p).length;
    results.push({pos,map:t2p,reuse,agree,score:reuse*2+agree*3});
  }
  results.sort((a,b)=>b.score-a.score||a.pos-b.pos);
  addLog("crib",{crib,mode,homophonic:homo,alignments:results.length});
  if(!results.length){ $("cribout").innerHTML=`<div class="warnbox">No consistent alignment found for "${esc(crib)}".</div>`; return; }
  $("cribout").innerHTML = "<table><tr><th>position</th><th>score</th><th>reused letters</th><th>agrees w/ map</th><th>implied mappings</th><th></th></tr>"+
   results.slice(0,60).map((r,i)=>`<tr><td>${r.pos}</td><td>${r.score}</td><td>${r.reuse}</td><td>${r.agree}</td>
   <td class="mono small">${Object.entries(r.map).map(([t,c])=>`${t}→${c}`).join("  ")}</td>
   <td><button class="ghost" onclick='applyCrib(${JSON.stringify(r.map)})'>apply (unlocked)</button></td></tr>`).join("")+"</table>"+
   `<div class="warnbox">⚠ ${results.length} consistent alignment(s) exist. Consistency alone is weak evidence — short cribs align by chance frequently. Compare counts against the shuffled-control expectation in Solvers → Validation.</div>`;
}
function applyCrib(m){
  for(const t in m) if(!(S.map[t]&&S.map[t].locked)) S.map[t]={ch:m[t],locked:false};
  addLog("cribApply",{mappings:m});
  renderSubst(); showTab(5);
}
</script>
<script>
"use strict";

<div class="row">

    <option value="hill">hill climb</option>

  </select></label>
  <label class="inline">iterations <input type="number" id="soliters" value="8000" style="width:90px"></label>
  <label class="inline">restarts <input type="number" id="solrest" value="5" style="width:60px"></label>
  <label class="inline">seed <input type="number" id="solseed" value="1" style="width:80px"></label>
  <label class="inline"><input type="checkbox" id="uselocked" checked> respect locked mappings</label>
  <label class="inline"><input type="checkbox" id="solhomo"> homophonic move space</label>
</div>
<div class="row">
  <button class="act" onclick="runSolver()">Run solver</button>
  <button class="ghost" onclick="runControl()">Run shuffled-control baseline</button>
  <button class="danger" onclick="S.solverResults=[];renderSolvers()">Clear results</button>
</div>
<div class="note">Scoring: normalized log-probability from embedded English unigram+bigram+trigram tables. Crib-guided solving = lock mappings from a crib first (Cribs tab → apply, then lock in Substitution tab), then run with "respect locked" on. Homophonic move space: solver may assign multiple tokens to the same letter via reassign moves.</div>
</div>
<div class="panel"><h3>Validation / Anti-Self-Deception</h3><div id="valbox"><div class="note">Run the shuffled-control baseline to estimate the score a solver reaches on order-destroyed text with identical token frequencies. A real decryption should beat this margin clearly AND read as sustained grammatical English — a high score alone proves nothing.</div></div></div>
<div class="panel"><h3>Candidates (top kept, deduplicated)</h3><div id="solout"></div></div>`;
let controlScore=null;
function lockedMapForSolver(){
  const locked={};
  if($("uselocked").checked) for(const t in S.map) if(S.map[t].locked) locked[t]=S.map[t].ch;
  return locked;
}
function runSolver(){
  if(!S.tokens.length){ alert("No tokens. Ingest and tokenize first."); return; }
  const mode=$("solmode").value;
  const iters=parseInt($("soliters").value,10)||8000;
  const seed=parseInt($("solseed").value,10)||1;
  const restarts=mode==="restart"?(parseInt($("solrest").value,10)||5):1;
  const locked=lockedMapForSolver();
  const t0=performance.now();
  const best=hillClimb(S.tokens,{seed,iters,locked,restarts,annealing:mode==="anneal",homophonic:$("solhomo").checked});
  const ms=(performance.now()-t0).toFixed(0);
  best.mode=mode; best.lockedCount=Object.keys(locked).length; best.ms=ms;
  // dedupe by plaintext
  if(!S.solverResults.some(r=>r.plaintext===best.plaintext)) S.solverResults.push(best);
  S.solverResults.sort((a,b)=>b.score-a.score);
  S.solverResults=S.solverResults.slice(0,10);
  addLog("solver",{mode,iters,seed,restarts,locked:Object.keys(locked)},{score:best.score,ms});
  renderSolvers();
}
function runControl(){
  if(!S.tokens.length) return;
  const iters=parseInt($("soliters").value,10)||8000;
  const seed=parseInt($("solseed").value,10)||1;
  const scores=[];
  for(let k=0;k<3;k++) scores.push(shuffledControlScore(S.tokens,seed+k,iters));
  controlScore=scores.reduce((a,b)=>a+b,0)/scores.length;
  addLog("shuffledControl",{iters,seed,runs:3},{meanScore:controlScore});
  renderSolvers();
}
function renderSolvers(){
  if(controlScore!==null){
    $("valbox").innerHTML=`<div class="row">
      <div class="stat warn"><div class="k">shuffled-control mean score</div><div class="v">${controlScore.toFixed(4)}</div></div>
      ${S.solverResults[0]?`<div class="stat ${S.solverResults[0].score>controlScore+0.15?'ok':'bad'}"><div class="k">best real score − control</div><div class="v">${(S.solverResults[0].score-controlScore).toFixed(4)}</div></div>`:""}
    </div>
    <div class="note">Shuffled controls reach surprisingly high scores because monoalphabetic solvers over-fit letter statistics. A margin near zero means the "solution" is indistinguishable from noise. Short accidental words (THE, AND) appear by chance in any high-scoring assignment — do not treat them as confirmation.</div>`;
  }
  $("solout").innerHTML = S.solverResults.length ?
    S.solverResults.map((r,i)=>{
      const seg=segmentDP(r.plaintext.slice(0,120));
      return `<div class="panel" style="margin-bottom:8px">
      <div class="row">
        <span class="badge hypo">candidate ${i+1}</span>
        <span class="mono small">score ${r.score.toFixed(4)} · ${r.mode} · seed ${r.seed} · ${r.iters} iters · ${r.lockedCount} locked · ${r.ms}ms</span>
        <button class="ghost" onclick='adoptKey(${i})'>adopt key as unlocked mappings</button>
        <button class="ghost" onclick='rerun(${i})'>reproduce (same seed)</button>
      </div>
      <pre class="out">${esc(r.plaintext)}</pre>
      <div class="small">DP segmentation attempt: <span class="mono">${seg?esc(seg.words.slice(0,25).join(" ")):"—"}</span></div>
      <div class="small">key: <span class="mono">${Object.entries(r.key).slice(0,40).map(([t,c])=>t+"→"+c).join(" ")}${Object.keys(r.key).length>40?" …":""}</span></div>
      </div>`;
    }).join("")
    : `<div class="note">No candidates yet.</div>`;
}
function adoptKey(i){
  const r=S.solverResults[i];
  for(const t in r.key) if(!(S.map[t]&&S.map[t].locked)) S.map[t]={ch:r.key[t],locked:false};
  addLog("adoptSolverKey",{candidate:i,score:r.score});
  renderSubst(); showTab(5);
}
function rerun(i){
  const r=S.solverResults[i];
  $("solseed").value=r.seed; $("soliters").value=r.iters;
  $("solmode").value=r.mode==="restart"?"restart":r.mode;
  runSolver();
}

<div class="panel"><h3>Apply Transposition</h3>
<div class="row">
  <label class="inline">target <select id="trtarget"><option value="tokens">token stream (mappings travel with tokens)</option><option value="plain">current partial decode string</option></select></label>
  <label class="inline">operation <select id="trop">
    <option value="reverse">reverse</option>
    <option value="oddEven">odd/even extraction</option>
    <option value="evenOdd">even/odd extraction</option>
    <option value="cyclic">cyclic shift k</option>
    <option value="railfence">rail fence</option>
    <option value="gridRowToCol">grid: row-major → column-major</option>
    <option value="gridColToRow">grid: column-major → row-major</option>
    <option value="reversedRows">grid: reversed rows</option>
    <option value="reversedCols">grid: reversed columns</option>

    <option value="routeSpiral">route: spiral (exact grids only)</option>

  <button class="act" onclick="runTrans()">Apply (preview)</button>
  <button class="ghost" onclick="sweepTrans()">Sweep all ops × all factor widths</button>
</div>
<div class="note">Key experimental property: transposing the TOKEN stream moves symbols; any mapping like 81→E stays attached to token 81 wherever it lands. Transposing the decode string moves characters at absolute positions instead. Both are available deliberately.</div>
<div class="row" id="trfactors"></div>
<pre class="out" id="trout"></pre>
<div class="scroll" id="trsweep"></div>
</div>`;
function currentTransposedView(op,param,target){
  const arr = target==="tokens" ? S.tokens : decodeString(S.tokens,S.map).split("");
  let res;
  switch(op){
    case "reverse": res=TRANS.reverse(arr); break;
    case "oddEven": res=TRANS.oddEven(arr); break;
    case "evenOdd": res=TRANS.evenOdd(arr); break;
    case "cyclic": res=TRANS.cyclicShift(arr,param); break;
    case "railfence": res=TRANS.railfence(arr,param); break;
    case "routeSpiral": res=TRANS.routeSpiral(arr,param); break;
    default: res=TRANS[op](arr,param);
  }
  return res;
}
function runTrans(){
  const op=$("trop").value, param=parseInt($("trparam").value,10)||2, target=$("trtarget").value;
  const res=currentTransposedView(op,param,target);
  if(!res){ $("trout").textContent="(spiral requires an exact rows×cols factorization — pick a divisor of length)"; return; }
  addLog("transposition",{op,param,target});
  if(target==="tokens"){
    $("trout").textContent = "tokens: "+res.slice(0,150).join(" ")+(res.length>150?" …":"")+
      "\n\ndecode: "+res.map(t=>S.map[t]?S.map[t].ch:"?").join("").slice(0,600);
  } else {
    $("trout").textContent = res.join("").slice(0,800);
  }
  $("trfactors").innerHTML = `<span class="small">valid grid widths for length ${target==="tokens"?S.tokens.length:decodeString(S.tokens,S.map).length}: ${factorizations(target==="tokens"?S.tokens.length:S.tokens.length).join(", ")||"none (prime or <4)"}</span>`;
}
/* Structural score: counts repeated token n-grams (2..4). A correct
   un-transposition realigns repeated plaintext words, so repeats jump.
   Works with ZERO mappings — no key needed. */
function structuralScore(tokArr){
  let s=0;
  for(let n=2;n<=4;n++){
    const m=new Map();
    for(let i=0;i+n<=tokArr.length;i++){
      const g=tokArr.slice(i,i+n).join(",");
      m.set(g,(m.get(g)||0)+1);
    }
    for(const c of m.values()) if(c>1) s += (c-1)*n*n; // weight longer repeats more
  }
  return s;
}
function sweepTrans(){
  const target=$("trtarget").value;
  const mappedCount=Object.keys(S.map).length;
  const useStructural = target==="tokens" && mappedCount < 5;
  const arr = target==="tokens" ? S.tokens : decodeString(S.tokens,S.map).split("");
  const rows=[];
  const evalArr = a => {
    if(!a) return null;
    if(useStructural){
      const preview=a.slice(0,25).join(" ");
      return {txt:preview, score: structuralScore(a)};
    }
    const txt = target==="tokens" ? a.map(t=>S.map[t]?S.map[t].ch:"?").join("") : a.join("");
    const clean = txt.replace(/\?/g,"");
    return {txt, score: clean.length ? scoreText(clean) : -Infinity};
  };
  const pushRow=(name,a)=>{ const e=evalArr(a); if(e && e.score>-Infinity) rows.push({name,arr:a,...e}); };
  pushRow("identity (no change — baseline)",[...arr]);
  pushRow("reverse",TRANS.reverse(arr));
  pushRow("oddEven",TRANS.oddEven(arr));
  pushRow("evenOdd",TRANS.evenOdd(arr));
  for(let r=2;r<=7;r++) pushRow(`railfence ${r}`,TRANS.railfence(arr,r));
  for(let k=1;k<=5;k++) pushRow(`cyclic ${k}`,TRANS.cyclicShift(arr,k));
  for(const c of factorizations(arr.length)){
    pushRow(`row→col w${c}`,TRANS.gridRowToCol(arr,c));
    pushRow(`col→row w${c}`,TRANS.gridColToRow(arr,c));
    pushRow(`revRows w${c}`,TRANS.reversedRows(arr,c));
    pushRow(`revCols w${c}`,TRANS.reversedCols(arr,c));
    pushRow(`boustro w${c}`,TRANS.boustrophedon(arr,c));
    pushRow(`spiral w${c}`,TRANS.routeSpiral(arr,c));
  }
  rows.sort((a,b)=>b.score-a.score);
  // stash full arrangements so they can be adopted
  window.__sweepRows = rows;
  addLog("transpositionSweep",{target,tested:rows.length,metric:useStructural?"structural-repeats":"english-ngrams"});
  const note = useStructural
    ? `<div class="okbox">Metric: STRUCTURAL (repeated token n-grams, weighted by length). No mappings needed. Compare every row against the identity baseline — only rearrangements scoring meaningfully ABOVE identity are interesting.</div>`
    : "";
  $("trsweep").innerHTML=note+"<table><tr><th>op</th><th>score</th><th>preview</th><th></th></tr>"+
    rows.slice(0,40).map((r,i)=>`<tr ${r.name.startsWith("identity")?'style="background:#16324a"':''}><td class="mono">${esc(r.name)}</td><td>${useStructural?r.score:r.score.toFixed(3)}</td><td class="mono small">${esc(String(r.txt).slice(0,70))}…</td><td>${target==="tokens"&&!r.name.startsWith("identity")?`<button class="ghost" onclick="adoptArrangement(${i})">adopt</button>`:""}</td></tr>`).join("")+"</table>"+
    `<div class="warnbox">⚠ Sweep scores rank arrangements only. Higher ≠ solved. Any candidate must survive the shuffled-control comparison and read as sustained English.</div>`;
}
function adoptArrangement(i){
  const r=window.__sweepRows[i];
  if(!r||!r.arr) return;
  S.tokens=[...r.arr];
  S.arrangedBy=r.name;
  addLog("adoptArrangement",{op:r.name,structuralScore:r.score});
  alert(`Working token stream is now "${r.name}" arrangement.\n\nNOTE: re-running Preprocess or Tokenize will rebuild from the digit stream and DISCARD this arrangement. The log records what you adopted.\n\nNext: Solvers tab → run shuffled control, then run solver, compare margins.`);
  renderTranspo();
}
